<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <title>Admin MenuFlow</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            padding:40px;
        }

        h1{
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#7d2ae8;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
        }

        .delete-btn{
            background:#e53935;
            color:white;
            padding:8px 14px;
            text-decoration:none;
            border-radius:8px;
        }

        .edit-btn{
            background:#2196f3;
            color:white;
            padding:8px 14px;
            text-decoration:none;
            border-radius:8px;
            margin-right:10px;
        }

        .add-btn{
            background:#4caf50;
            color:white;
            padding:10px 20px;
            text-decoration:none;
            border-radius:8px;
        }

    </style>

</head>

<body>

    <h1>⚙️ Admin MenuFlow</h1>

    <a
        class="add-btn"
        href="/add"
    >
        ➕ Add Product
    </a>

    <br><br>

    <table>

        <tr>
            <th>ID</th>
            <th>Categorie</th>
            <th>Produs</th>
            <th>Pret</th>
            <th>Actiune</th>
        </tr>

        {% for item in items %}

        <tr>

            <td>{{ item.id }}</td>

            <td>{{ item.category }}</td>

            <td>{{ item.name }}</td>

            <td>{{ item.price }}</td>

            <td>

                <a
                    class="edit-btn"
                    href="/edit/{{ item.id }}"
                >
                    ✏️ Edit
                </a>

                <a
                    class="delete-btn"
                    href="/delete/{{ item.id }}"
                    onclick="return confirm('Esti sigur ca vrei sa stergi acest produs?')"
                >
                    🗑 Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
